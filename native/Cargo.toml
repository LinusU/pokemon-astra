[package]
name = "astra-native"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
crystal-battle = { path = "../vendor/crystal-battle" }
pokemon-synthesizer = { path = "../vendor/pokemon-synthesizer" }
pokemon-sprite-compression = { path = "../vendor/pokemon-sprite-compression" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
